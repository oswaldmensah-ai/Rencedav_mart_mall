{% extends 'base.html' %} {% block title %}Paystack Webhook Simulator — {{ SITE_NAME }}{% endblock %} {% block content %}
<div class="max-w-2xl mx-auto p-4">
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-stone-200">
        <h1 class="text-3xl font-bold mb-4">Paystack Webhook Simulator</h1>
        <p class="text-stone-600 mb-6">Use this page to simulate a Paystack webhook event for an order.</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-stone-700">Order ID</label>
                <input name="order_id" class="mt-1 w-full rounded-lg border-stone-300 p-2.5 text-sm" placeholder="123" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-stone-700">Reference</label>
                <input name="reference" class="mt-1 w-full rounded-lg border-stone-300 p-2.5 text-sm" placeholder="order_12345_xyz" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-stone-700">Amount (GHS)</label>
                <input name="amount" type="number" step="0.01" class="mt-1 w-full rounded-lg border-stone-300 p-2.5 text-sm" placeholder="100.00" value="100.00" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-stone-700">Status</label>
                <select name="status" class="mt-1 w-full rounded-lg border-stone-300 p-2.5 text-sm">
          <option value="success">success</option>
          <option value="failed">failed</option>
          <option value="abandoned">abandoned</option>
        </select>
            </div>
            <button type="submit" class="mt-4 w-full bg-emerald-600 text-white py-3 rounded-xl hover:bg-emerald-700 transition-colors">Simulate Webhook</button>
        </form>
    </div>
</div>
{% endblock %}
