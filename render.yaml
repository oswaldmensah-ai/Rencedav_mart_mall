services:
  - type: web
    name: rencedav-mart
    runtime: python
    buildCommand: pip install -r requirements/production.txt && python manage.py migrate --no-input && python manage.py configure_google_oauth && python manage.py collectstatic --no-input
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120 --access-logfile -
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: rencedav-mart-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: rencedav-mart.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://rencedav-mart.onrender.com
      - key: SITE_URL
        value: https://rencedav-mart.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

databases:
  - name: rencedav-mart-db
    databaseName: rencedav_mart
    user: rencedav_mart